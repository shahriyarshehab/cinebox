name: Auto Collect Movies & Sync Cloudstream

on:
  schedule:
    # Runs everyday at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  collect-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloudstream Movie Collector
        run: |
          python cloudstream_collector.py

      - name: Commit & Push Updated Movies Catalog
        run: |
          git config user.name "CineBox Bot"
          git config user.email "bot@users.noreply.github.com"
          git add movies.json
          git commit -m "Auto-update: Sync latest movies & media streams [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"
