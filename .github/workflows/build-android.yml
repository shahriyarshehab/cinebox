name: Build CineBox Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../cinebox.apk

      - name: Upload CineBox APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineBox-APK
          path: cinebox.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0
          name: CineBox Native Android App (v2.0)
          body: |
            ## 🎬 CineBox Standalone Android APK (v2.0)
            
            Official full-screen Android app for CineBox with hardware-accelerated playback and high-speed BDIX downloading.
            
            ### ✨ Key Features:
            - 🚀 **100% Standalone Full-screen**: Native Android WebView architecture — no Chrome URL bar, no browser banners.
            - ⚡ **BDIX & Mother Server Cleartext Support**: Seamless playback and poster loading from local BDIX servers (172.16.50.*).
            - 🎬 **Dedicated Fullscreen Video Player**: Auto-rotates to landscape, auto-hides system navigation bars for immersive movie watching.
            - 📥 **Native High-Speed Downloader**: Built-in Android DownloadManager saves movies directly to your phone's Downloads directory.
            - 📺 **External Players Bridge**: 1-tap launching in VLC Media Player, MX Player, and System Player.
            - 🔄 **Pull-to-Refresh & OLED Dark Theme**: Smooth gestures with Cyber Cyan styling.
            
            ### 📦 Installation:
            1. Download **`cinebox.apk`** below.
            2. Tap the downloaded file to install on your Android phone, tablet, or Android TV.
            3. Enjoy buffer-free movies and series!
          files: cinebox.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
