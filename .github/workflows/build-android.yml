name: Build CineBox Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../cinebox.apk

      - name: Upload CineBox APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineBox-APK
          path: cinebox.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0-apk
          name: CineBox Native Android App (v2.0)
          body: |
            ## 🎬 CineBox Standalone Android APK (v2.0)
            
            - 🚀 **Full-screen Edge-to-Edge UI**: Runs standalone without Chrome or browser address bars.
            - ⚡ **Hardware Accelerated**: Instant 0ms streaming with custom HTML5 video fullscreen player.
            - 🔄 **Pull-to-Refresh & High-Speed Media Downloader**: Integrated native download manager.
            - 🌓 **Deep OLED Dark Theme**: Designed specifically for movies, anime & TV series.
          files: cinebox.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
