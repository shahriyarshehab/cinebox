<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBox — Stream & Download 36,000+ Movies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090e;
            --bg-surface: #0e121a;
            --bg-card: #131924;
            --bg-card-hover: #1c2434;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 229, 255, 0.4);
            
            --primary: #00e5ff;
            --primary-glow: rgba(0, 229, 255, 0.25);
            --accent: #ff2a5f;
            --accent-gold: #ffb800;
            --accent-green: #00e676;
            
            --text-main: #ffffff;
            --text-muted: #8e9bb0;
            --text-dim: #5a667a;
            
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            flex-shrink: 0;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 9, 14, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #00e5ff 0%, #0077b6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #07090e;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .brand-name span {
            color: var(--primary);
        }

        .live-status {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.25);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .search-wrap {
            flex: 1;
            max-width: 520px;
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 11px 20px 11px 44px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-wrap input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        /* Buttons */
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #07090e;
            font-weight: 700;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-primary:hover {
            background: #33ebff;
            transform: translateY(-2px);
        }

        .btn-vlc {
            background: linear-gradient(135deg, #ff7700 0%, #e65100 100%);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(255, 119, 0, 0.35);
        }

        .btn-vlc:hover {
            background: linear-gradient(135deg, #ff8800 0%, #f57c00 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 119, 0, 0.5);
        }

        .btn-accent {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(255, 42, 95, 0.3);
        }

        .btn-accent:hover {
            background: #ff4775;
            transform: translateY(-2px);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-see-all {
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.25);
            color: var(--primary);
            font-size: 12.5px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-see-all:hover {
            background: var(--primary);
            color: #07090e;
            border-color: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
            transform: translateX(3px);
        }

        /* Carousel Section */
        .carousel-wrapper {
            margin: 24px 40px 0;
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: #07090e;
            border: 1px solid var(--border);
            box-shadow: 0 24px 50px rgba(0,0,0,0.7);
        }

        .carousel-track {
            position: relative;
            width: 100%;
            height: 430px;
        }

        .carousel-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s ease;
            display: flex;
            align-items: center;
        }

        .carousel-slide.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center 25%;
            filter: blur(10px) brightness(0.65);
            opacity: 0.6;
            transform: scale(1.08);
            transition: transform 6s ease;
        }

        .carousel-slide.active .slide-bg {
            transform: scale(1.15);
        }

        .slide-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, #07090e 0%, rgba(7, 9, 14, 0.85) 45%, rgba(7, 9, 14, 0.35) 100%),
                        linear-gradient(0deg, #07090e 0%, transparent 60%);
        }

        .slide-container {
            position: relative;
            z-index: 2;
            padding: 40px 60px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .slide-content {
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .slide-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: var(--primary);
            font-size: 11.5px;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            width: fit-content;
            backdrop-filter: blur(8px);
        }

        .slide-title {
            font-family: var(--font-display);
            font-size: 36px;
            font-weight: 800;
            line-height: 1.2;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 4px 16px rgba(0,0,0,0.8);
        }

        .slide-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .slide-poster-showcase {
            position: relative;
            width: 220px;
            height: 330px;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--border-hover);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 229, 255, 0.35);
            flex-shrink: 0;
            display: block;
            transform: perspective(700px) rotateY(-6deg);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .slide-poster-showcase:hover {
            transform: perspective(700px) rotateY(0deg) scale(1.05);
            border-color: var(--primary);
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.95), 0 0 40px rgba(0, 229, 255, 0.5);
        }

        .slide-poster-showcase img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-poster-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: var(--primary);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(7, 9, 14, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .carousel-btn:hover {
            background: var(--primary);
            color: #07090e;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .carousel-btn.prev { left: 20px; }
        .carousel-btn.next { right: 20px; }

        .carousel-dots {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .carousel-dot.active {
            width: 32px;
            border-radius: 10px;
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* Row Section Block (Single Horizontal Row per Category) */
        .category-row-block {
            margin-bottom: 38px;
        }

        .row-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .row-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .row-heading {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row-badge {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Single Horizontal Scrolling Row */
        .row-slider {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 8px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .row-slider::-webkit-scrollbar {
            height: 4px;
        }

        .row-slider::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
        }

        .row-slider::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .row-slider .movie-card {
            flex: 0 0 170px;
            width: 170px;
        }

        /* Full Grid Layout (Compact Nice Sizing) */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px 16px;
        }

        .movie-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 16px rgba(0, 229, 255, 0.2);
        }

        .card-cover {
            position: relative;
            width: 100%;
            padding-top: 144%;
            background: linear-gradient(135deg, #151c2a 0%, #0a0e16 100%);
            overflow: hidden;
        }

        .card-cover img {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .movie-card:hover .card-cover img {
            transform: scale(1.06);
        }

        .cover-fallback {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            text-align: center;
            color: var(--text-dim);
        }

        .cover-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
            opacity: 0;
            transition: opacity 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 12px;
            z-index: 3;
        }

        .movie-card:hover .cover-overlay {
            opacity: 1;
        }

        .play-button-symbol {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: #07090e;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .tag-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--primary);
            font-size: 9.5px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
        }

        .rating-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 184, 0, 0.3);
            color: var(--accent-gold);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 3px;
            z-index: 2;
        }

        .card-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-card);
        }

        .card-title {
            font-size: 12.5px;
            font-weight: 600;
            line-height: 1.3;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10.5px;
            color: var(--text-muted);
        }

        /* Full View Header Bar */
        .category-view-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .pagination-wrap {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        /* Movie Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 24px;
        }

        .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 920px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-row {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .modal-poster-thumb {
            width: 160px;
            height: 240px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .modal-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            line-height: 1.25;
        }

        .modal-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .modal-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .modal-btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .player-frame {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 1px solid var(--border);
        }

        video {
            width: 100%;
            max-height: 480px;
            outline: none;
        }

        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-green);
            color: #07090e;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            display: none;
            z-index: 600;
            box-shadow: 0 8px 24px rgba(0, 230, 118, 0.3);
        }

        @media (max-width: 768px) {
            header { padding: 12px 18px; }
            .carousel-wrapper { margin: 16px 18px 0; }
            .carousel-track { height: 360px; }
            .slide-container { padding: 24px 20px; }
            .slide-poster-showcase { display: none; }
            .content-area { padding: 18px 18px 40px; }
            .poster-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 16px 12px; }
            .modal-row { flex-direction: column; align-items: center; text-align: center; }
            .modal-chips { justify-content: center; }
            .modal-btn-row { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand" onclick="showHomeView()">
            <div class="brand-mark">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <div class="brand-name">Cine<span>Box</span></div>
            <div class="live-status">
                <span class="live-status-dot"></span>
                <span id="totalCountBadge">36,000+ Movies</span>
            </div>
        </div>

        <div class="search-wrap">
            <span class="search-icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Search across 36,000+ movies, Hollywood, Bollywood, Anime..." oninput="handleSearch()">
        </div>

        <div>
            <button class="btn btn-ghost" onclick="showHomeView()">All Rows</button>
        </div>
    </header>

    <!-- Latest Updates Carousel -->
    <div class="carousel-wrapper" id="heroCarousel">
        <div class="carousel-track" id="carouselTrack"></div>

        <button class="carousel-btn prev" onclick="prevSlide()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="carousel-btn next" onclick="nextSlide()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <div class="carousel-dots" id="carouselDots"></div>
    </div>

    <!-- Main Content Area -->
    <div class="content-area" id="mainContent">
        <!-- Rendered dynamically as Category Rows or Full Category Grid -->
    </div>

    <!-- Movie Modal -->
    <div class="modal" id="movieModal">
        <div class="modal-card">
            <div class="modal-header">
                <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Media Details</span>
                <button class="btn btn-ghost" style="padding: 4px 10px;" onclick="closeModal()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-row">
                    <img id="mPoster" class="modal-poster-thumb" src="" alt="Poster">
                    <div class="modal-info">
                        <div class="modal-title" id="mTitle">Movie Title</div>
                        <div class="modal-chips" id="mTags"></div>
                        <p style="font-size: 13px; color: var(--text-muted); line-height: 1.6;">
                            Direct high-speed media stream and download enabled. Compatible with browser video player and VLC Media Player.
                        </p>
                        <div class="modal-btn-row" id="mActions"></div>
                    </div>
                </div>

                <!-- TV Series Season & Episode Explorer -->
                <div id="tvExplorerWrap" style="display: none; border-top: 1px solid var(--border); padding-top: 18px; margin-top: 10px;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px;">
                        <div style="font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px;">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                            <span>Select Season & Episode to Play</span>
                        </div>
                        <div id="seasonCountBadge" style="font-size: 11.5px; background: rgba(0, 229, 255, 0.12); color: var(--primary); font-weight: 700; padding: 3px 10px; border-radius: 12px;">Loading seasons...</div>
                    </div>
                    
                    <!-- Season Selector Bar -->
                    <div id="seasonTabs" style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 6px;"></div>

                    <!-- Episode Selector List -->
                    <div id="episodeList" style="display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 4px;"></div>
                </div>

                <!-- Video Player Container with Episode Title & Next/Prev Controls -->
                <div class="player-frame" id="videoWrap" style="display: none; margin-top: 16px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border);">
                    <div id="playerNowPlayingBar" style="padding: 10px 16px; background: rgba(14, 18, 26, 0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                        <div style="font-size: 13px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            <span style="width: 8px; height: 8px; border-radius: 50%; background: #00e676; display: inline-block; box-shadow: 0 0 8px #00e676;"></span>
                            <span id="playerCurrentEpTitle">Playing Media</span>
                        </div>
                        <div id="playerNavBtns" style="display: none; gap: 8px; flex-shrink: 0;">
                            <button class="btn btn-ghost" style="padding: 4px 10px; font-size: 11.5px;" onclick="playPrevEpisode()">◀ Prev</button>
                            <button class="btn btn-primary" style="padding: 4px 10px; font-size: 11.5px;" onclick="playNextEpisode()">Next ▶</button>
                        </div>
                    </div>
                    <video id="videoPlayer" controls style="width: 100%; max-height: 480px; outline: none; background: #000;"></video>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Link copied to clipboard</div>

    <script>
        let allMovies = [];
        let currentView = 'home'; // 'home' | 'category' | 'search'
        let currentCategoryTag = 'All';
        let currentCategoryName = 'All Movies';
        let filteredMovies = [];
        let displayedCount = 40;
        const BATCH_SIZE = 40;

        let currentSlide = 0;
        let carouselMovies = [];
        let carouselTimer = null;

        const CATEGORY_ROWS = [
            { name: 'IMDb Top 250', tag: 'Top Rated', limit: 8 },
            { name: 'Animation & Anime', tag: 'Animation', limit: 8 },
            { name: 'Hollywood 1080p', tag: 'Hollywood 1080p', limit: 8 },
            { name: 'Bollywood (Hindi)', tag: 'Bollywood', limit: 8 },
            { name: 'South Hindi Dubbed', tag: 'South Action', limit: 8 },
            { name: 'South Original', tag: 'South Original', limit: 8 },
            { name: 'TV & Web Series', tag: 'TV Series', limit: 8 },
            { name: 'Korean Drama', tag: 'K-Drama', limit: 8 },
            { name: 'Bangla Movies', tag: 'Bangla', limit: 8 },
            { name: 'Foreign Movies', tag: 'Foreign Movies', limit: 8 },
            { name: '3D Movies', tag: '3D Movies', limit: 8 },
            { name: 'English Classic Movies', tag: 'English Movies', limit: 8 }
        ];

        // Official VLC Cone SVG (svgrepo:349556)
        const VLC_ICON_SVG = `
            <svg class="icon" viewBox="0 0 512 512" width="16" height="16" aria-label="VLC" style="vertical-align: middle;">
                <g fill="#f7901e">
                    <path d="M437 400l-36-94c-3-10-13-16-23-16H134c-10 0-20 6-23 16l-36 94c-2 3-2 7-2 11 0 16 13 29 29 29h308a29 29 0 0 0 27-40z"/>
                    <path d="M299 109l-15-51c-3-11-13-18-24-18h-8c-11 0-21 7-24 18l-15 51a307 307 0 0 0 86 0zM256 183c-24 0-46-2-64-6l-19 65c20 8 49 13 83 13s63-5 83-13l-20-65c-17 4-39 6-63 6z"/>
                </g>
                <g fill="#ffffff">
                    <path d="M319 177l-20-68a307 307 0 0 1-86 0l-21 68c18 4 40 6 64 6s46-2 63-6z"/>
                    <path d="M173 242l-18 62c19 14 55 23 101 23s82-9 101-23l-18-62c-20 8-49 13-83 13s-63-5-83-13z"/>
                </g>
            </svg>
        `;

        async function init() {
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div style="text-align: center; padding: 60px 20px;">
                    <div style="font-size: 16px; font-weight: 600; color: var(--text-muted);">Loading 36,000+ Movies & Category Rows...</div>
                </div>
            `;

            try {
                const res = await fetch('./movies.json?v=' + Date.now());
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                const rawMovies = await res.json();
                
                allMovies = rawMovies.map(item => {
                    if (Array.isArray(item)) {
                        return {
                            title: item[0] || '',
                            poster: item[1] || '',
                            url: item[2] || '',
                            tag: item[3] || 'HD',
                            category: item[4] || 'Cinema',
                            size: item[5] || 'HD',
                            date: item[6] || ''
                        };
                    }
                    return item;
                }).filter(m => {
                    const t = (m.title || '').trim().toLowerCase();
                    return t && !t.includes('parent directory') && t !== '..' && t !== '.';
                });

                document.getElementById('totalCountBadge').textContent = `${allMovies.length.toLocaleString()} Movies`;
                
                setupCarousel();
                renderView();
            } catch (err) {
                console.error("Load error:", err);
                main.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <p style="color: #ff527b; font-size: 15px; margin-bottom: 16px;">Failed to load catalog: ${err.message}</p>
                        <button class="btn btn-primary" onclick="init()">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                            <span>Retry Loading</span>
                        </button>
                    </div>
                `;
            }
        }

        function setupCarousel() {
            const featuredList = [];
            const seenTitles = new Set();

            const candidates = [
                ...allMovies.filter(m => m.poster && m.title.includes('2026')),
                ...allMovies.filter(m => m.poster && m.title.includes('2025')),
                ...allMovies.filter(m => m.poster && m.tag === 'Top Rated'),
                ...allMovies.filter(m => m.poster && m.tag === 'Animation'),
                ...allMovies.filter(m => m.poster && m.tag === 'Bollywood'),
                ...allMovies.filter(m => m.poster && m.tag === 'South Action')
            ];

            for (const c of candidates) {
                if (!seenTitles.has(c.title) && c.poster) {
                    seenTitles.add(c.title);
                    featuredList.push(c);
                    if (featuredList.length >= 10) break;
                }
            }

            carouselMovies = featuredList.length > 0 ? featuredList : allMovies.slice(0, 10);

            const track = document.getElementById('carouselTrack');
            track.innerHTML = carouselMovies.map((m, idx) => `
                <div class="carousel-slide ${idx === 0 ? 'active' : ''}" id="slide-${idx}">
                    <div class="slide-bg" style="background-image: url('${m.poster}')"></div>
                    <div class="slide-overlay"></div>
                    <div class="slide-container">
                        <div class="slide-content">
                            <div class="slide-tag">Featured • ${m.tag || 'Latest Release'}</div>
                            <h2 class="slide-title" title="${escapeQuotes(m.title)}">${m.title}</h2>
                            <div class="slide-meta">
                                <span style="color: var(--accent-gold); font-weight: 700;">★ 8.9 / 10</span>
                                <span>•</span>
                                <span>${m.size || 'HD 1080P'}</span>
                                <span>•</span>
                                <span>${m.category || 'Cinema'}</span>
                            </div>
                            <div style="display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap;">
                                <button class="btn btn-primary" onclick="openDirectMovie('${escapeQuotes(m.title)}')">
                                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M8 5v14l11-7z"/></svg>
                                    <span>Watch Stream</span>
                                </button>
                                <button class="btn btn-vlc" onclick="openInVLC('${m.url}', '${escapeQuotes(m.title)}')">
                                    ${VLC_ICON_SVG}
                                    <span>Play in VLC</span>
                                </button>
                                <a class="btn btn-ghost" href="${m.url}" download>
                                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                    <span>Download</span>
                                </a>
                            </div>
                        </div>

                        <div class="slide-poster-showcase" onclick="openDirectMovie('${escapeQuotes(m.title)}')">
                            <img src="${m.poster}" alt="${escapeQuotes(m.title)}" loading="eager"
                                 onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400';">
                            <div class="slide-poster-badge">${m.tag || 'HD'}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            const dots = document.getElementById('carouselDots');
            dots.innerHTML = carouselMovies.map((_, idx) => `
                <div class="carousel-dot ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})"></div>
            `).join('');

            startCarouselAuto();
        }

        function startCarouselAuto() {
            clearInterval(carouselTimer);
            carouselTimer = setInterval(nextSlide, 5000);
        }

        function showSlide(idx) {
            document.querySelectorAll('.carousel-slide').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            document.querySelectorAll('.carousel-dot').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            currentSlide = idx;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % carouselMovies.length;
            showSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + carouselMovies.length) % carouselMovies.length;
            showSlide(currentSlide);
        }

        function goToSlide(idx) {
            showSlide(idx);
            startCarouselAuto();
        }

        function openDirectMovie(title) {
            const item = allMovies.find(m => m.title === title);
            if (item) {
                renderModalContent(item);
            }
        }

        function renderView() {
            const main = document.getElementById('mainContent');

            if (currentView === 'home') {
                document.getElementById('heroCarousel').style.display = 'block';
                renderHomeRows(main);
            } else {
                document.getElementById('heroCarousel').style.display = 'none';
                renderCategoryFullGrid(main);
            }
        }

        function renderHomeRows(container) {
            let html = '';

            CATEGORY_ROWS.forEach(cat => {
                const catMovies = allMovies.filter(m => m.tag === cat.tag || (m.category && m.category.includes(cat.tag)));
                if (catMovies.length === 0) return;

                const topSlice = catMovies.slice(0, 12);

                html += `
                    <div class="category-row-block">
                        <div class="row-header">
                            <div class="row-title-wrap">
                                <h2 class="row-heading">${cat.name}</h2>
                                <span class="row-badge">${catMovies.length.toLocaleString()} items</span>
                            </div>
                            <button class="btn-see-all" onclick="openCategoryView('${cat.tag}', '${escapeQuotes(cat.name)}')">
                                <span>Show All</span>
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            </button>
                        </div>

                        <div class="row-slider">
                            ${topSlice.map((item) => renderMovieCardHtml(item)).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderCategoryFullGrid(container) {
            const toShow = filteredMovies.slice(0, displayedCount);

            container.innerHTML = `
                <div class="category-view-bar">
                    <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
                        <button class="btn btn-ghost" onclick="showHomeView()">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            <span>Back to All Categories</span>
                        </button>
                        <h1 class="row-heading" style="font-size: 24px;">${currentCategoryName}</h1>
                    </div>
                    <div style="font-size: 13px; color: var(--text-muted);">
                        Showing ${toShow.length} of ${filteredMovies.length.toLocaleString()} titles
                    </div>
                </div>

                <div class="poster-grid" id="movieGrid">
                    ${toShow.map((item) => renderMovieCardHtml(item)).join('')}
                </div>

                <div class="pagination-wrap">
                    <button class="btn btn-ghost" id="loadMoreBtn" style="${displayedCount < filteredMovies.length ? 'display:block' : 'display:none'}" onclick="loadMore()">Load More Movies</button>
                </div>
            `;
        }

        function renderMovieCardHtml(item) {
            const safeTitle = escapeQuotes(item.title);
            const safeObj = encodeURIComponent(JSON.stringify(item));

            return `
                <div class="movie-card" onclick="openItemFromData('${safeObj}')">
                    <div class="card-cover">
                        <img src="${item.poster}" alt="${safeTitle}" loading="lazy"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="cover-fallback" style="display: none;">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32"><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
                            <div style="font-size: 11.5px; font-weight: 600;">${item.title}</div>
                        </div>

                        <div class="tag-badge">${item.tag || 'HD'}</div>
                        <div class="rating-badge">
                            <svg class="icon" viewBox="0 0 24 24" fill="#ffb800" width="12" height="12"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            <span>8.8</span>
                        </div>

                        <div class="cover-overlay">
                            <div class="play-button-symbol">
                                <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                            <span style="font-size: 11.5px; font-weight: 700; color: #fff;">Stream / VLC / Download</span>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="card-title" title="${item.title}">${item.title}</div>
                        <div class="card-meta">
                            <span>${item.size || 'HD'}</span>
                            <span>${item.date || ''}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function showHomeView() {
            currentView = 'home';
            document.getElementById('searchInput').value = '';
            renderView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openCategoryView(tag, name) {
            currentView = 'category';
            currentCategoryTag = tag;
            currentCategoryName = name || tag;
            filteredMovies = allMovies.filter(m => m.tag === tag || (m.category && m.category.includes(tag)));
            displayedCount = BATCH_SIZE;
            renderView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!q) {
                showHomeView();
                return;
            }

            currentView = 'search';
            currentCategoryName = `Search: "${q}"`;
            filteredMovies = allMovies.filter(m => 
                (m.title && m.title.toLowerCase().includes(q)) || 
                (m.category && m.category.toLowerCase().includes(q)) || 
                (m.tag && m.tag.toLowerCase().includes(q))
            );
            displayedCount = BATCH_SIZE;
            renderView();
        }

        function loadMore() {
            if (displayedCount >= filteredMovies.length) return;
            displayedCount += BATCH_SIZE;
            
            const grid = document.getElementById('movieGrid');
            if (grid) {
                const toShow = filteredMovies.slice(0, displayedCount);
                grid.innerHTML = toShow.map(item => renderMovieCardHtml(item)).join('');
                document.getElementById('loadMoreBtn').style.display = displayedCount < filteredMovies.length ? 'block' : 'none';
            }
        }

        // Auto-load on scroll
        let scrollTimeout = null;
        window.addEventListener('scroll', () => {
            if (currentView === 'home') return;
            if (scrollTimeout) return;
            scrollTimeout = setTimeout(() => {
                scrollTimeout = null;
                const scrollHeight = document.documentElement.scrollHeight;
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const clientHeight = window.innerHeight || document.documentElement.clientHeight;

                if (scrollTop + clientHeight >= scrollHeight - 500) {
                    if (displayedCount < filteredMovies.length) {
                        loadMore();
                    }
                }
            }, 100);
        });

        function openItemFromData(encodedJson) {
            try {
                const item = JSON.parse(decodeURIComponent(encodedJson));
                renderModalContent(item);
            } catch (e) {
                console.error(e);
            }
        }

        function renderModalContent(item) {
            document.getElementById('mTitle').textContent = item.title;
            document.getElementById('mPoster').src = item.poster;
            document.getElementById('mPoster').style.display = 'block';

            const isSeries = item.tag === 'TV Series' || item.tag === 'K-Drama' || item.url.endsWith('/');

            document.getElementById('mTags').innerHTML = `
                <span class="modal-chip">Category: ${item.category || item.tag}</span>
                <span class="modal-chip">Type: ${isSeries ? 'TV Series' : 'Movie'}</span>
                <span class="modal-chip">Size: ${item.size || 'HD'}</span>
                <span class="modal-chip">Score: 8.8/10</span>
            `;

            document.getElementById('mActions').innerHTML = `
                <button class="btn btn-primary" onclick="startStream('${item.url}')">
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M8 5v14l11-7z"/></svg>
                    <span>${isSeries ? 'Play First / Stream' : 'Play in Browser'}</span>
                </button>
                <button class="btn btn-vlc" onclick="openInVLC('${item.url}', '${escapeQuotes(item.title)}')">
                    ${VLC_ICON_SVG}
                    <span>Play in VLC</span>
                </button>
                <a class="btn btn-accent" href="${item.url}" target="_blank" download>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>${isSeries ? 'Open Series Folder' : 'Download'}</span>
                </a>
                <button class="btn btn-ghost" onclick="copyLink('${item.url}')">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    <span>Copy URL</span>
                </button>
            `;

            const vWrap = document.getElementById('videoWrap');
            vWrap.style.display = 'none';
            const player = document.getElementById('videoPlayer');
            player.pause();
            player.src = '';

            const tvWrap = document.getElementById('tvExplorerWrap');
            if (isSeries) {
                tvWrap.style.display = 'block';
                loadTvSeriesSeasons(item.url, item.title);
            } else {
                tvWrap.style.display = 'none';
            }

            document.getElementById('movieModal').style.display = 'flex';
        }

        let motherFolderSpecials = [];

        async function loadTvSeriesSeasons(seriesUrl, seriesTitle) {
            const tabs = document.getElementById('seasonTabs');
            const epList = document.getElementById('episodeList');
            const countBadge = document.getElementById('seasonCountBadge');

            tabs.innerHTML = '<div style="font-size: 12px; color: var(--text-muted);">Loading seasons & episodes...</div>';
            epList.innerHTML = '';
            countBadge.textContent = 'Scanning...';
            motherFolderSpecials = [];

            try {
                const res = await fetch(seriesUrl);
                if (!res.ok) throw new Error('Cannot fetch directory directly');
                const html = await res.text();

                // Extract all hrefs
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'));

                const seasonDirs = [];
                const directVideos = [];

                links.forEach(a => {
                    const href = a.getAttribute('href');
                    const text = (a.textContent || '').trim();
                    if (!href || text.toLowerCase().includes('parent directory') || text === '..' || text === '.' || href.includes('browsehappy')) return;
                    if (href.endsWith('.jpg') || href.endsWith('.png') || href.endsWith('.nfo') || href.endsWith('.txt')) return;

                    const absoluteUrl = new URL(href, seriesUrl).href;
                    if (href.endsWith('/') || text.toLowerCase().includes('season') || text.toLowerCase().includes('s0')) {
                        seasonDirs.push({ name: text, url: absoluteUrl });
                    } else if (href.match(/\.(mp4|mkv|avi|webm)$/i)) {
                        directVideos.push({ name: text, url: absoluteUrl });
                    }
                });

                motherFolderSpecials = directVideos;

                if (seasonDirs.length > 0) {
                    const totalSeasons = seasonDirs.length + (directVideos.length > 0 ? 1 : 0);
                    countBadge.textContent = `${seasonDirs.length} Seasons ${directVideos.length > 0 ? '+ Specials' : ''}`;

                    let tabsHtml = seasonDirs.map((s, idx) => `
                        <button class="btn btn-ghost ${idx === 0 ? 'active' : ''}" style="font-size: 12px; padding: 6px 14px; border-radius: 20px; ${idx === 0 ? 'background: var(--primary); color: #07090e; font-weight: 700;' : ''}" onclick="selectSeason(this, '${s.url}', '${escapeQuotes(s.name)}')">
                            ${s.name}
                        </button>
                    `).join('');

                    if (directVideos.length > 0) {
                        tabsHtml += `
                            <button class="btn btn-ghost" style="font-size: 12px; padding: 6px 14px; border-radius: 20px; border-color: rgba(255, 184, 0, 0.4); color: #ffb800;" onclick="selectSpecialsTab(this)">
                                ★ Specials / Bonus (${directVideos.length})
                            </button>
                        `;
                    }

                    tabs.innerHTML = tabsHtml;

                    // Load first season episodes by default
                    loadSeasonEpisodes(seasonDirs[0].url, seasonDirs[0].name);
                } else if (directVideos.length > 0) {
                    countBadge.textContent = `${directVideos.length} Episodes`;
                    tabs.innerHTML = '<span style="font-size: 12px; color: var(--primary); font-weight: 700;">Episodes</span>';
                    currentSeasonEpisodes = directVideos;
                    currentPlayingEpisodeIdx = -1;
                    renderEpisodeListHtml(directVideos);
                } else {
                    fallbackTvView(seriesUrl, seriesTitle);
                }
            } catch (err) {
                fallbackTvView(seriesUrl, seriesTitle);
            }
        }

        function selectSpecialsTab(btnEl) {
            document.querySelectorAll('#seasonTabs button').forEach(b => {
                b.style.background = 'rgba(255, 255, 255, 0.05)';
                b.style.color = '#fff';
                b.style.fontWeight = '600';
            });
            btnEl.style.background = 'var(--accent-gold)';
            btnEl.style.color = '#07090e';
            btnEl.style.fontWeight = '700';

            currentSeasonName = 'Specials / Bonus';
            currentSeasonEpisodes = motherFolderSpecials;
            currentPlayingEpisodeIdx = -1;
            renderEpisodeListHtml(motherFolderSpecials);
        }

        async function selectSeason(btnEl, seasonUrl, seasonName) {
            document.querySelectorAll('#seasonTabs button').forEach(b => {
                b.style.background = 'rgba(255, 255, 255, 0.05)';
                b.style.color = '#fff';
                b.style.fontWeight = '600';
            });
            btnEl.style.background = 'var(--primary)';
            btnEl.style.color = '#07090e';
            btnEl.style.fontWeight = '700';

            loadSeasonEpisodes(seasonUrl, seasonName);
        }

        let currentSeasonEpisodes = [];
        let currentPlayingEpisodeIdx = -1;
        let currentSeasonName = 'Season 1';

        async function loadSeasonEpisodes(seasonUrl, seasonName) {
            currentSeasonName = seasonName;
            const epList = document.getElementById('episodeList');
            epList.innerHTML = '<div style="font-size: 12px; color: var(--text-muted); padding: 10px;">Loading episodes...</div>';

            try {
                const res = await fetch(seasonUrl);
                if (!res.ok) throw new Error('Fetch failed');
                const html = await res.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'));

                const episodes = [];
                links.forEach(a => {
                    const href = a.getAttribute('href');
                    const text = (a.textContent || '').trim();
                    if (!href || text.toLowerCase().includes('parent directory')) return;
                    if (href.match(/\.(mp4|mkv|avi|webm)$/i)) {
                        episodes.push({ name: text, url: new URL(href, seasonUrl).href });
                    }
                });

                currentSeasonEpisodes = episodes;
                currentPlayingEpisodeIdx = -1;

                if (episodes.length > 0) {
                    renderEpisodeListHtml(episodes);
                } else {
                    epList.innerHTML = `
                        <div style="padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center;">
                            <span>${seasonName} Files</span>
                            <a class="btn btn-primary" style="padding: 4px 10px; font-size: 11.5px;" href="${seasonUrl}" target="_blank">Open Season Directory</a>
                        </div>
                    `;
                }
            } catch (err) {
                epList.innerHTML = `
                    <div style="padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center;">
                        <span>Browse ${seasonName}</span>
                        <a class="btn btn-primary" style="padding: 4px 10px; font-size: 11.5px;" href="${seasonUrl}" target="_blank">Open Season Folder</a>
                    </div>
                `;
            }
        }

        function renderEpisodeListHtml(episodes) {
            const epList = document.getElementById('episodeList');
            epList.innerHTML = episodes.map((ep, idx) => {
                const isPlaying = idx === currentPlayingEpisodeIdx;
                return `
                <div id="ep-item-${idx}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: ${isPlaying ? 'rgba(0, 229, 255, 0.1)' : 'rgba(255,255,255,0.03)'}; border: 1px solid ${isPlaying ? 'var(--primary)' : 'var(--border)'}; border-radius: 8px; transition: all 0.2s ease;">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden;">
                        <span style="font-size: 11px; font-weight: 800; color: ${isPlaying ? 'var(--primary)' : 'var(--text-dim)'}; min-width: 22px;">${idx + 1}</span>
                        <div style="font-size: 12.5px; font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeQuotes(ep.name)}">
                            ${ep.name}
                        </div>
                    </div>
                    <div style="display: flex; gap: 6px; flex-shrink: 0;">
                        <button class="btn btn-primary" style="padding: 5px 10px; font-size: 11px;" onclick="playSpecificEpisode(${idx})">
                            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="10" height="10"><path d="M8 5v14l11-7z"/></svg>
                            <span>${isPlaying ? 'Playing' : 'Play'}</span>
                        </button>
                        <button class="btn btn-vlc" style="padding: 5px 10px; font-size: 11px;" onclick="openInVLC('${ep.url}', '${escapeQuotes(ep.name)}')">
                            ${VLC_ICON_SVG}
                            <span>VLC</span>
                        </button>
                        <a class="btn btn-ghost" style="padding: 5px 8px; font-size: 11px;" href="${ep.url}" download>
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </a>
                    </div>
                </div>
            `;}).join('');
        }

        function playSpecificEpisode(idx) {
            if (!currentSeasonEpisodes[idx]) return;
            currentPlayingEpisodeIdx = idx;
            const ep = currentSeasonEpisodes[idx];

            document.getElementById('playerCurrentEpTitle').textContent = `${currentSeasonName} • ${ep.name}`;
            document.getElementById('playerNavBtns').style.display = 'flex';

            renderEpisodeListHtml(currentSeasonEpisodes);

            startStream(ep.url);

            // Scroll player into view
            document.getElementById('videoWrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function playNextEpisode() {
            if (currentPlayingEpisodeIdx + 1 < currentSeasonEpisodes.length) {
                playSpecificEpisode(currentPlayingEpisodeIdx + 1);
            } else {
                const toast = document.getElementById('toast');
                toast.textContent = 'End of this season';
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2500);
            }
        }

        function playPrevEpisode() {
            if (currentPlayingEpisodeIdx > 0) {
                playSpecificEpisode(currentPlayingEpisodeIdx - 1);
            }
        }

        function fallbackTvView(seriesUrl, seriesTitle) {
            document.getElementById('seasonCountBadge').textContent = 'Series Directory';
            document.getElementById('seasonTabs').innerHTML = `
                <a class="btn btn-primary" style="font-size: 12px; padding: 6px 14px; border-radius: 20px;" href="${seriesUrl}" target="_blank">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    <span>Browse All Seasons & Episodes on Server</span>
                </a>
            `;
            document.getElementById('episodeList').innerHTML = `
                <div style="font-size: 12px; color: var(--text-muted); padding: 8px 4px; line-height: 1.5;">
                    Click above to browse all season folders and stream/download any episode directly via high-speed BDIX.
                </div>
            `;
        }

        function openInVLC(url, title) {
            const cleanTitle = (title || 'movie').replace(/[/\\?%*:|"<>]/g, '_');
            const m3uContent = `#EXTM3U\n#EXTINF:-1,${title}\n${url}\n`;
            const blob = new Blob([m3uContent], { type: 'application/x-mpegurl' });
            const blobUrl = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = `${cleanTitle}.m3u`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);

            setTimeout(() => {
                try {
                    window.location.href = `vlc://${url}`;
                } catch (e) {}
            }, 300);

            const toast = document.getElementById('toast');
            toast.textContent = 'Opening stream in VLC Player...';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function startStream(url) {
            const vWrap = document.getElementById('videoWrap');
            const player = document.getElementById('videoPlayer');
            vWrap.style.display = 'block';
            player.src = url;
            player.play().catch(e => {
                console.log('Playback notice:', e);
            });
        }

        function closeModal() {
            const player = document.getElementById('videoPlayer');
            player.pause();
            player.src = '';
            document.getElementById('movieModal').style.display = 'none';
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url);
            const toast = document.getElementById('toast');
            toast.textContent = 'Link copied to clipboard';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\\\'").replace(/"/g, '&quot;');
        }

        window.onload = init;
    </script>
</body>
</html>
