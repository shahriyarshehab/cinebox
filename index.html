<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBox — Stream & Download 36,000+ Movies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090e;
            --bg-surface: #0e121a;
            --bg-card: #131924;
            --bg-card-hover: #1c2434;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 229, 255, 0.4);
            
            --primary: #00e5ff;
            --primary-glow: rgba(0, 229, 255, 0.25);
            --accent: #ff2a5f;
            --accent-gold: #ffb800;
            --accent-green: #00e676;
            --vlc-orange: #ff7700;
            
            --text-main: #ffffff;
            --text-muted: #8e9bb0;
            --text-dim: #5a667a;
            
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            flex-shrink: 0;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 9, 14, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #00e5ff 0%, #0077b6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #07090e;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .brand-name span {
            color: var(--primary);
        }

        .live-status {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.25);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .search-wrap {
            flex: 1;
            max-width: 520px;
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 11px 20px 11px 44px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-wrap input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        /* Buttons */
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #07090e;
            font-weight: 700;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-primary:hover {
            background: #33ebff;
            transform: translateY(-2px);
        }

        .btn-vlc {
            background: linear-gradient(135deg, #ff7700 0%, #e65100 100%);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(255, 119, 0, 0.35);
        }

        .btn-vlc:hover {
            background: linear-gradient(135deg, #ff8800 0%, #f57c00 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 119, 0, 0.5);
        }

        .btn-accent {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(255, 42, 95, 0.3);
        }

        .btn-accent:hover {
            background: #ff4775;
            transform: translateY(-2px);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Carousel Section */
        .carousel-wrapper {
            margin: 24px 40px 0;
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: #07090e;
            border: 1px solid var(--border);
            box-shadow: 0 24px 48px rgba(0,0,0,0.7);
        }

        .carousel-track {
            position: relative;
            width: 100%;
            height: 450px;
        }

        .carousel-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            display: flex;
            align-items: center;
        }

        .carousel-slide.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center top;
            filter: blur(4px) brightness(0.55);
            transform: scale(1.05);
            opacity: 0.75;
        }

        .slide-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, #07090e 0%, rgba(7, 9, 14, 0.85) 45%, rgba(7, 9, 14, 0.35) 75%, rgba(7, 9, 14, 0.15) 100%),
                        linear-gradient(0deg, #07090e 0%, transparent 40%);
        }

        .slide-container {
            position: relative;
            z-index: 2;
            padding: 40px 60px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .slide-content {
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .slide-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: var(--primary);
            font-size: 11.5px;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: fit-content;
        }

        .slide-title {
            font-family: var(--font-display);
            font-size: 38px;
            font-weight: 800;
            line-height: 1.2;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 4px 16px rgba(0,0,0,0.8);
        }

        .slide-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .slide-poster-showcase {
            position: relative;
            width: 240px;
            height: 350px;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--border-hover);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 229, 255, 0.35);
            flex-shrink: 0;
            display: block;
            transform: perspective(700px) rotateY(-6deg);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .slide-poster-showcase:hover {
            transform: perspective(700px) rotateY(0deg) scale(1.05);
            border-color: var(--primary);
        }

        .slide-poster-showcase img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-poster-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(7, 9, 14, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.5);
            color: var(--primary);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(7, 9, 14, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .carousel-btn:hover {
            background: var(--primary);
            color: #07090e;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .carousel-btn.prev { left: 20px; }
        .carousel-btn.next { right: 20px; }

        .carousel-dots {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .carousel-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .carousel-dot.active {
            width: 32px;
            border-radius: 10px;
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* Categories Slider */
        .category-nav {
            padding: 20px 40px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .cat-tab {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .cat-tab:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateY(-2px);
        }

        .cat-tab.active {
            background: var(--primary);
            color: #07090e;
            font-weight: 700;
            border-color: var(--primary);
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .cat-count {
            background: rgba(0, 0, 0, 0.25);
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
        }

        /* Main Container */
        .content-area {
            padding: 24px 40px 60px;
            flex: 1;
        }

        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-heading {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .counter-badge {
            font-size: 12.5px;
            color: var(--text-muted);
        }

        /* Poster Grid */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 28px 20px;
        }

        .movie-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .movie-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 24px rgba(0, 229, 255, 0.2);
        }

        .card-cover {
            position: relative;
            width: 100%;
            padding-top: 148%;
            background: linear-gradient(135deg, #151c2a 0%, #0a0e16 100%);
            overflow: hidden;
        }

        .card-cover img {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .movie-card:hover .card-cover img {
            transform: scale(1.07);
        }

        .cover-fallback {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            text-align: center;
            color: var(--text-dim);
        }

        .cover-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.88) 100%);
            opacity: 0;
            transition: opacity 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 16px;
            z-index: 3;
        }

        .movie-card:hover .cover-overlay {
            opacity: 1;
        }

        .play-button-symbol {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--primary);
            color: #07090e;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .tag-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.35);
            color: var(--primary);
            font-size: 10.5px;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 6px;
            z-index: 2;
            letter-spacing: 0.3px;
        }

        .rating-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 184, 0, 0.35);
            color: var(--accent-gold);
            font-size: 11.5px;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-card);
        }

        .card-title {
            font-size: 14.5px;
            font-weight: 700;
            line-height: 1.35;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--text-muted);
        }

        .pagination-wrap {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        /* Movie Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 24px;
        }

        .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 960px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .modal-body {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-row {
            display: flex;
            gap: 28px;
            align-items: flex-start;
        }

        .modal-poster-thumb {
            width: 210px;
            height: 310px;
            border-radius: 14px;
            object-fit: cover;
            border: 2px solid var(--border);
            flex-shrink: 0;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .modal-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            line-height: 1.25;
        }

        .modal-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .modal-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .modal-btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .player-frame {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 1px solid var(--border);
        }

        video {
            width: 100%;
            max-height: 480px;
            outline: none;
        }

        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-green);
            color: #07090e;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            display: none;
            z-index: 600;
            box-shadow: 0 8px 24px rgba(0, 230, 118, 0.3);
        }

        @media (max-width: 768px) {
            header { padding: 12px 18px; }
            .carousel-wrapper { margin: 16px 18px 0; }
            .carousel-track { height: 360px; }
            .slide-content { padding: 24px 20px; }
            .category-nav { padding: 16px 18px 0; }
            .content-area { padding: 18px 18px 40px; }
            .poster-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 16px 12px; }
            .modal-row { flex-direction: column; align-items: center; text-align: center; }
            .modal-chips { justify-content: center; }
            .modal-btn-row { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand" onclick="filterCategory('All')">
            <div class="brand-mark">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <div class="brand-name">Cine<span>Box</span></div>
            <div class="live-status">
                <span class="live-status-dot"></span>
                <span id="totalCountBadge">36,000+ Movies</span>
            </div>
        </div>

        <div class="search-wrap">
            <span class="search-icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Search across 36,000+ movies, Hollywood, Bollywood, Anime..." oninput="handleSearch()">
        </div>

        <div>
            <a class="btn btn-ghost" href="#categories">Categories</a>
        </div>
    </header>

    <!-- Latest Updates Carousel -->
    <div class="carousel-wrapper" id="heroCarousel">
        <div class="carousel-track" id="carouselTrack">
            <!-- Carousel Slides Rendered Here -->
        </div>

        <button class="carousel-btn prev" onclick="prevSlide()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="carousel-btn next" onclick="nextSlide()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <div class="carousel-dots" id="carouselDots"></div>
    </div>

    <!-- Category Nav -->
    <div class="category-nav" id="categories"></div>

    <!-- Main Content Area -->
    <div class="content-area">
        <div class="section-bar">
            <div class="section-heading" id="sectionTitle">All Movies & Releases</div>
            <div class="counter-badge" id="matchCounter">Loading movies...</div>
        </div>

        <div class="poster-grid" id="movieGrid"></div>

        <div class="pagination-wrap">
            <button class="btn btn-ghost" id="loadMoreBtn" onclick="loadMore()">Load More Movies</button>
        </div>
    </div>

    <!-- Movie Modal -->
    <div class="modal" id="movieModal">
        <div class="modal-card">
            <div class="modal-header">
                <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Media Details</span>
                <button class="btn btn-ghost" style="padding: 4px 10px;" onclick="closeModal()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-row">
                    <img id="mPoster" class="modal-poster-thumb" src="" alt="Poster">
                    <div class="modal-info">
                        <div class="modal-title" id="mTitle">Movie Title</div>
                        <div class="modal-chips" id="mTags"></div>
                        <p style="font-size: 13px; color: var(--text-muted); line-height: 1.6;">
                            Direct high-speed media stream and download enabled. Compatible with browser video player and VLC Media Player.
                        </p>
                        <div class="modal-btn-row" id="mActions"></div>
                    </div>
                </div>

                <div class="player-frame" id="videoWrap">
                    <video id="videoPlayer" controls></video>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Link copied to clipboard</div>

    <script>
        let allMovies = [];
        let filteredMovies = [];
        let displayedCount = 40;
        const BATCH_SIZE = 40;

        let currentSlide = 0;
        let carouselMovies = [];
        let carouselTimer = null;

        const CATEGORY_DEFS = [
            { name: 'All Movies', tag: 'All' },
            { name: 'IMDb Top 250', tag: 'Top Rated' },
            { name: 'Animation & Anime', tag: 'Animation' },
            { name: 'Hollywood 1080p', tag: 'Hollywood 1080p' },
            { name: 'English Movies', tag: 'English Movies' },
            { name: 'Bollywood (Hindi)', tag: 'Bollywood' },
            { name: 'South Hindi Dubbed', tag: 'South Action' },
            { name: 'South Original', tag: 'South Original' },
            { name: 'TV & Web Series', tag: 'TV Series' },
            { name: 'Korean Drama', tag: 'K-Drama' },
            { name: 'Bangla Movies', tag: 'Bangla' },
            { name: 'Foreign Movies', tag: 'Foreign Movies' },
            { name: '3D Movies', tag: '3D Movies' }
        ];

        let currentActiveTag = 'All';

        // Official VLC Cone SVG (svgrepo:349556)
        const VLC_ICON_SVG = `
            <svg class="icon" viewBox="0 0 512 512" width="16" height="16" aria-label="VLC" style="vertical-align: middle;">
                <g fill="#f7901e">
                    <path d="M437 400l-36-94c-3-10-13-16-23-16H134c-10 0-20 6-23 16l-36 94c-2 3-2 7-2 11 0 16 13 29 29 29h308a29 29 0 0 0 27-40z"/>
                    <path d="M299 109l-15-51c-3-11-13-18-24-18h-8c-11 0-21 7-24 18l-15 51a307 307 0 0 0 86 0zM256 183c-24 0-46-2-64-6l-19 65c20 8 49 13 83 13s63-5 83-13l-20-65c-17 4-39 6-63 6z"/>
                </g>
                <g fill="#ffffff">
                    <path d="M319 177l-20-68a307 307 0 0 1-86 0l-21 68c18 4 40 6 64 6s46-2 63-6z"/>
                    <path d="M173 242l-18 62c19 14 55 23 101 23s82-9 101-23l-18-62c-20 8-49 13-83 13s-63-5-83-13z"/>
                </g>
            </svg>
        `;

        async function init() {
            try {
                const res = await fetch('./movies.json');
                const rawMovies = await res.json();
                allMovies = rawMovies.filter(m => {
                    const t = (m.title || '').trim().toLowerCase();
                    return t && !t.includes('parent directory') && t !== '..' && t !== '.';
                });

                document.getElementById('totalCountBadge').textContent = `${allMovies.length.toLocaleString()} Movies`;
                filteredMovies = [...allMovies];
                
                setupCarousel();
                renderCategoryChips();
                renderGrid();
            } catch (err) {
                document.getElementById('movieGrid').innerHTML = `<p style="color: var(--accent); grid-column: 1/-1; text-align: center; padding: 40px;">Failed to load catalog: ${err.message}</p>`;
            }
        }

        function setupCarousel() {
            // Select 10 diverse top & latest releases across categories
            const featuredList = [];
            const seenTitles = new Set();

            const candidates = [
                ...allMovies.filter(m => m.poster && m.title.includes('2026')),
                ...allMovies.filter(m => m.poster && m.title.includes('2025')),
                ...allMovies.filter(m => m.poster && m.tag === 'Top Rated'),
                ...allMovies.filter(m => m.poster && m.tag === 'Animation'),
                ...allMovies.filter(m => m.poster && m.tag === 'Bollywood'),
                ...allMovies.filter(m => m.poster && m.tag === 'South Action')
            ];

            for (const c of candidates) {
                if (!seenTitles.has(c.title) && c.poster) {
                    seenTitles.add(c.title);
                    featuredList.push(c);
                    if (featuredList.length >= 10) break;
                }
            }

            carouselMovies = featuredList.length > 0 ? featuredList : allMovies.slice(0, 10);

            const track = document.getElementById('carouselTrack');
            track.innerHTML = carouselMovies.map((m, idx) => `
                <div class="carousel-slide ${idx === 0 ? 'active' : ''}" id="slide-${idx}">
                    <div class="slide-bg" style="background-image: url('${m.poster}')"></div>
                    <div class="slide-overlay"></div>
                    <div class="slide-container">
                        <div class="slide-content">
                            <div class="slide-tag">Featured • ${m.tag || 'Latest Release'}</div>
                            <h2 class="slide-title" title="${escapeQuotes(m.title)}">${m.title}</h2>
                            <div class="slide-meta">
                                <span style="color: var(--accent-gold); font-weight: 700;">★ 8.9 / 10</span>
                                <span>•</span>
                                <span>${m.size || 'HD 1080P'}</span>
                                <span>•</span>
                                <span>${m.category || 'Cinema'}</span>
                            </div>
                            <div style="display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap;">
                                <button class="btn btn-primary" onclick="openDirectMovie('${escapeQuotes(m.title)}')">
                                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M8 5v14l11-7z"/></svg>
                                    <span>Watch Stream</span>
                                </button>
                                <button class="btn btn-vlc" onclick="openInVLC('${m.url}', '${escapeQuotes(m.title)}')">
                                    ${VLC_ICON_SVG}
                                    <span>Play in VLC</span>
                                </button>
                                <a class="btn btn-ghost" href="${m.url}" download>
                                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                    <span>Download</span>
                                </a>
                            </div>
                        </div>

                        <div class="slide-poster-showcase" onclick="openDirectMovie('${escapeQuotes(m.title)}')">
                            <img src="${m.poster}" alt="${escapeQuotes(m.title)}" loading="eager"
                                 onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400';">
                            <div class="slide-poster-badge">${m.tag || 'HD'}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            const dots = document.getElementById('carouselDots');
            dots.innerHTML = carouselMovies.map((_, idx) => `
                <div class="carousel-dot ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})"></div>
            `).join('');

            startCarouselAuto();
        }

        function startCarouselAuto() {
            clearInterval(carouselTimer);
            carouselTimer = setInterval(nextSlide, 5000);
        }

        function showSlide(idx) {
            document.querySelectorAll('.carousel-slide').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            document.querySelectorAll('.carousel-dot').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            currentSlide = idx;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % carouselMovies.length;
            showSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + carouselMovies.length) % carouselMovies.length;
            showSlide(currentSlide);
        }

        function goToSlide(idx) {
            showSlide(idx);
            startCarouselAuto();
        }

        function openDirectMovie(title) {
            const idx = filteredMovies.findIndex(m => m.title === title);
            if (idx !== -1) {
                openModal(idx);
            }
        }

        function renderCategoryChips() {
            const counts = {};
            counts['All'] = allMovies.length;
            
            allMovies.forEach(m => {
                const t = m.tag || 'Other';
                counts[t] = (counts[t] || 0) + 1;
            });

            const nav = document.getElementById('categories');
            nav.innerHTML = CATEGORY_DEFS.map(def => {
                const cnt = counts[def.tag] || 0;
                return `
                    <div class="cat-tab ${def.tag === currentActiveTag ? 'active' : ''}" onclick="filterCategory('${def.tag}')">
                        <span>${def.name}</span>
                        <span class="cat-count">${cnt.toLocaleString()}</span>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(tag) {
            currentActiveTag = tag;
            renderCategoryChips();

            document.getElementById('searchInput').value = '';
            const activeDef = CATEGORY_DEFS.find(d => d.tag === tag);
            document.getElementById('sectionTitle').textContent = activeDef ? activeDef.name : tag;

            if (tag === 'All') {
                filteredMovies = [...allMovies];
            } else {
                filteredMovies = allMovies.filter(m => m.tag === tag || (m.category && m.category.includes(tag)));
            }

            displayedCount = BATCH_SIZE;
            renderGrid();
            document.querySelector('.content-area').scrollIntoView({ behavior: 'smooth' });
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!q) {
                filterCategory(currentActiveTag);
                return;
            }

            filteredMovies = allMovies.filter(m => 
                (m.title && m.title.toLowerCase().includes(q)) || 
                (m.category && m.category.toLowerCase().includes(q)) || 
                (m.tag && m.tag.toLowerCase().includes(q))
            );

            document.getElementById('sectionTitle').textContent = `Search: "${q}"`;
            displayedCount = BATCH_SIZE;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('movieGrid');
            const toShow = filteredMovies.slice(0, displayedCount);

            document.getElementById('matchCounter').textContent = `Showing ${toShow.length} of ${filteredMovies.length.toLocaleString()} titles`;

            if (toShow.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 48px;">No matching titles found in this selection.</p>';
                document.getElementById('loadMoreBtn').style.display = 'none';
                return;
            }

            grid.innerHTML = toShow.map((item, idx) => `
                <div class="movie-card" onclick="openModal(${idx})">
                    <div class="card-cover">
                        <img src="${item.poster}" alt="${escapeQuotes(item.title)}" loading="lazy"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="cover-fallback" style="display: none;">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32"><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
                            <div style="font-size: 11.5px; font-weight: 600;">${item.title}</div>
                        </div>

                        <div class="tag-badge">${item.tag || 'HD'}</div>
                        <div class="rating-badge">
                            <svg class="icon" viewBox="0 0 24 24" fill="#ffb800" width="12" height="12"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            <span>8.8</span>
                        </div>

                        <div class="cover-overlay">
                            <div class="play-button-symbol">
                                <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                            <span style="font-size: 11.5px; font-weight: 700; color: #fff;">Stream / VLC / Download</span>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="card-title" title="${item.title}">${item.title}</div>
                        <div class="card-meta">
                            <span>${item.size || 'HD'}</span>
                            <span>${item.date || ''}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('loadMoreBtn').style.display = displayedCount < filteredMovies.length ? 'block' : 'none';
        }

        function loadMore() {
            if (displayedCount >= filteredMovies.length) return;
            displayedCount += BATCH_SIZE;
            renderGrid();
        }

        // Auto-load on scroll
        let scrollTimeout = null;
        window.addEventListener('scroll', () => {
            if (scrollTimeout) return;
            scrollTimeout = setTimeout(() => {
                scrollTimeout = null;
                const scrollHeight = document.documentElement.scrollHeight;
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const clientHeight = window.innerHeight || document.documentElement.clientHeight;

                if (scrollTop + clientHeight >= scrollHeight - 500) {
                    if (displayedCount < filteredMovies.length) {
                        loadMore();
                    }
                }
            }, 100);
        });

        function openModal(idx) {
            const item = filteredMovies[idx];
            if (!item) return;

            document.getElementById('mTitle').textContent = item.title;
            document.getElementById('mPoster').src = item.poster;
            document.getElementById('mPoster').style.display = 'block';

            document.getElementById('mTags').innerHTML = `
                <span class="modal-chip">Category: ${item.category || item.tag}</span>
                <span class="modal-chip">Quality: ${item.tag || 'Cinema'}</span>
                <span class="modal-chip">Size: ${item.size || 'HD'}</span>
                <span class="modal-chip">Score: 8.8/10</span>
            `;

            document.getElementById('mActions').innerHTML = `
                <button class="btn btn-primary" onclick="startStream('${item.url}')">
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M8 5v14l11-7z"/></svg>
                    <span>Play in Browser</span>
                </button>
                <button class="btn btn-vlc" onclick="openInVLC('${item.url}', '${escapeQuotes(item.title)}')">
                    ${VLC_ICON_SVG}
                    <span>Play in VLC</span>
                </button>
                <a class="btn btn-accent" href="${item.url}" download>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Download</span>
                </a>
                <button class="btn btn-ghost" onclick="copyLink('${item.url}')">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    <span>Copy URL</span>
                </button>
            `;

            const vWrap = document.getElementById('videoWrap');
            vWrap.style.display = 'none';
            const player = document.getElementById('videoPlayer');
            player.pause();
            player.src = '';

            document.getElementById('movieModal').style.display = 'flex';
        }

        function openInVLC(url, title) {
            const cleanTitle = (title || 'movie').replace(/[/\\?%*:|"<>]/g, '_');
            const m3uContent = `#EXTM3U\n#EXTINF:-1,${title}\n${url}\n`;
            const blob = new Blob([m3uContent], { type: 'application/x-mpegurl' });
            const blobUrl = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = `${cleanTitle}.m3u`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);

            setTimeout(() => {
                try {
                    window.location.href = `vlc://${url}`;
                } catch (e) {}
            }, 300);

            const toast = document.getElementById('toast');
            toast.textContent = 'Opening stream in VLC Player...';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function startStream(url) {
            const vWrap = document.getElementById('videoWrap');
            const player = document.getElementById('videoPlayer');
            vWrap.style.display = 'block';
            player.src = url;
            player.play().catch(e => {
                console.log('Playback notice:', e);
            });
        }

        function closeModal() {
            const player = document.getElementById('videoPlayer');
            player.pause();
            player.src = '';
            document.getElementById('movieModal').style.display = 'none';
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url);
            const toast = document.getElementById('toast');
            toast.textContent = 'Link copied to clipboard';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\\\'").replace(/"/g, '&quot;');
        }

        window.onload = init;
    </script>
</body>
</html>
