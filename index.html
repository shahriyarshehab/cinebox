<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBox — Stream & Download 36,000+ Movies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand" onclick="showHomeView()">
            <div class="brand-mark">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <div class="brand-name">Cine<span>Box</span></div>
            <div class="live-status">
                <span class="live-status-dot"></span>
                <span id="totalCountBadge">36,000+ Movies</span>
            </div>
        </div>

        <div class="search-wrap">
            <span class="search-icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Search across 36,000+ movies, Hollywood, Bollywood, Anime..." oninput="handleSearch()">
        </div>

        <div>
            <button class="btn btn-ghost" onclick="showHomeView()">All Rows</button>
        </div>
    </header>

    <!-- Latest Updates Carousel -->
    <div class="carousel-wrapper" id="heroCarousel">
        <div class="carousel-track" id="carouselTrack"></div>

        <button class="carousel-btn prev" onclick="prevSlide()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="carousel-btn next" onclick="nextSlide()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <div class="carousel-dots" id="carouselDots"></div>
    </div>

    <!-- Main Content Area -->
    <div class="content-area" id="mainContent">
        <!-- Rendered dynamically as Category Rows or Full Category Grid -->
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
