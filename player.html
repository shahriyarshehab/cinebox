<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBox Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #06080d;
            --primary: #00e5ff;
            --accent: #ff2a5f;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background: rgba(10, 14, 22, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            overflow: hidden;
        }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo span {
            color: var(--primary);
        }

        .movie-title-display {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 1px solid var(--border);
            padding-left: 16px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-accent:hover {
            background: #ff4775;
        }

        /* Video Container */
        .player-viewport {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 60px);
            outline: none;
            background: #000;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #00e676;
            color: #06080d;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a class="brand-logo" href="index.html">
                <svg viewBox="0 0 24 24" fill="#00e5ff" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>
                <span>CineBox</span>
            </a>
            <div class="movie-title-display" id="playerTitle">Loading Movie...</div>
        </div>

        <div class="header-actions">
            <a class="btn btn-accent" id="downloadBtn" href="#" download>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Download</span>
            </a>
            <button class="btn" onclick="copyStreamLink()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                <span>Copy URL</span>
            </button>
            <button class="btn" onclick="window.close()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                <span>Close</span>
            </button>
        </div>
    </header>

    <div class="player-viewport">
        <video id="videoPlayer" controls autoplay preload="auto"></video>
    </div>

    <div class="toast" id="toast">Link copied to clipboard</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get('v');
        const title = params.get('t') || 'Movie Stream';
        const poster = params.get('p') || '';

        document.title = `${title} • CineBox Player`;
        document.getElementById('playerTitle').textContent = title;

        const player = document.getElementById('videoPlayer');
        if (videoUrl) {
            player.src = videoUrl;
            if (poster) player.poster = poster;
            document.getElementById('downloadBtn').href = videoUrl;
            player.play().catch(e => console.log('Autoplay waiting for user gesture'));
        } else {
            document.getElementById('playerTitle').textContent = 'No video URL specified';
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                player.paused ? player.play() : player.pause();
            } else if (e.code === 'KeyF') {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    player.requestFullscreen();
                }
            } else if (e.code === 'KeyM') {
                player.muted = !player.muted;
            } else if (e.code === 'ArrowRight') {
                player.currentTime += 10;
            } else if (e.code === 'ArrowLeft') {
                player.currentTime -= 10;
            }
        });

        function copyStreamLink() {
            if (videoUrl) {
                navigator.clipboard.writeText(videoUrl);
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 3000);
            }
        }
    </script>
</body>
</html>
